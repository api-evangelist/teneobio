name: Teneobio
description: Teneobio was a privately held, clinical-stage biotechnology company developing a new class
  of biologics, Human Heavy-Chain Antibodies (UniAb), for the treatment of cancer, autoimmunity, and
  infectious diseases. Its TeneoSeek discovery platform combined genetically engineered animals (UniRat,
  OmniFlic), next-generation sequencing, bioinformatics, and high-throughput vector assembly. Teneobio
  was surfaced as a portfolio company of Lightspeed Venture Partners and added to the API Evangelist
  network as an enrichment lead. Amgen acquired Teneobio in October 2021 for $900 million upfront plus
  up to $1.6 billion in contingent milestone payments; the company no longer operates independently and
  publishes no live developer surface. This is a life-sciences / therapeutics company with no public API,
  developer portal, or machine-readable API artifacts.
